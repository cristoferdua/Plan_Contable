{# Cabecera comun de las paginas de cumplimiento (PLE, ejercicio, EEFF, usuarios...). #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='polish.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<script src="{{ url_for('static', filename='ui.js') }}"></script>
<script src="{{ url_for('static', filename='polish.js') }}" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f2f5f9; color:#1f2937; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; }
  .card { background:#fff; border-radius:14px; padding:1.2rem 1.4rem; margin-bottom:1rem; box-shadow:0 2px 10px rgba(15,23,42,.05); border:1px solid transparent; }
  .card h2 { margin:0 0 .3rem; font-size:1.05rem; display:flex; align-items:center; gap:.4rem; }
  .card .sub { margin:0 0 .9rem; color:var(--muted, #6b7785); font-size:.85rem; line-height:1.45; }
  .row { display:flex; gap:.7rem; flex-wrap:wrap; align-items:flex-end; }
  .fld label { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; font-weight:600; color:var(--muted, #6b7785); margin-bottom:.2rem; }
  .fld input, .fld select { padding:.5rem .6rem; border-radius:10px; border:1px solid #cbd5e1; font:inherit; min-width:120px; background-color:transparent; color:inherit; }
  .btn { display:inline-flex; align-items:center; gap:.35rem; padding:.55rem 1rem; border-radius:8px; border:1px solid #cbd5e1; background:#fff; color:#1e3a5f; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.primary { background:#1e3a5f; border-color:#1e3a5f; color:#fff; }
  .btn.warn { background:#b7791f; border-color:#b7791f; color:#fff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  table.t { width:100%; border-collapse:collapse; }
  table.t th { text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted, #6b7785); padding:.5rem .6rem; border-bottom:1px solid rgba(127,127,127,.25); }
  table.t td { padding:.5rem .6rem; border-bottom:1px solid rgba(127,127,127,.12); font-size:.86rem; vertical-align:top; }
  table.t td.num, table.t th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.t tr.total td { font-weight:700; border-top:2px solid rgba(127,127,127,.35); }
  table.t tr.sub td { font-weight:700; background:rgba(44,82,130,.06); }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .pill { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.72rem; font-weight:700; }
  .pill.ok { background:#e6f4ea; color:#1e7a3c; }
  .pill.bad { background:#fdecea; color:#b42318; }
  .pill.warn { background:#fff4e0; color:#9a5b00; }
  .obs { list-style:none; margin:0; padding:0; }
  .obs li { padding:.45rem .7rem; border-radius:8px; margin-bottom:.35rem; font-size:.85rem; display:flex; gap:.45rem; align-items:flex-start; }
  .obs li.error { background:#fdecea; color:#8a1c12; }
  .obs li.aviso { background:#fff4e0; color:#7a4a00; }
  .note { font-size:.8rem; color:var(--muted, #6b7785); line-height:1.5; }
  html[data-theme="dark"] .btn { background:#1a2129; color:#e5eaf0; border-color:#2a3340; }
  html[data-theme="dark"] .btn.primary { background:#3b82b8; border-color:#3b82b8; }
  html[data-theme="dark"] .fld input, html[data-theme="dark"] .fld select { border-color:#2a3340; }
</style>
