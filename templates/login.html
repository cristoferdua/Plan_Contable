<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if modo == 'setup' %}Crear administrador{% else %}Iniciar sesion{% endif %} - Plan Contable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='polish.css') }}">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#1f2937; }
    .box { background:#fff; width:min(380px, 92vw); border-radius:16px; padding:2rem 1.8rem; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    .brand { display:flex; align-items:center; gap:.6rem; margin-bottom:1.2rem; }
    .brand .ic { font-size:2rem; color:#e67e22; }
    .brand h1 { margin:0; font-size:1.15rem; color:#1e3a5f; }
    .brand small { display:block; color:#6b7785; font-weight:500; font-size:.78rem; }
    label { display:block; font-size:.75rem; font-weight:600; color:#4a5568; margin:.8rem 0 .25rem; }
    input { width:100%; padding:.65rem .75rem; border:1px solid #cbd5e1; border-radius:9px; font:inherit; }
    input:focus { outline:2px solid #2c5282; border-color:transparent; }
    button { width:100%; margin-top:1.3rem; padding:.75rem; border:0; border-radius:9px; background:#1e3a5f; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#2c5282; }
    .err { background:#fdecea; color:#8a1c12; border-radius:8px; padding:.55rem .7rem; font-size:.84rem; margin-bottom:.5rem; }
    .info { background:#eef3f8; color:#1e3a5f; border-radius:8px; padding:.6rem .75rem; font-size:.82rem; line-height:1.45; }
  </style>
</head>
<body>
  <form class="box" method="post" autocomplete="on">
    <div class="brand">
      <span class="ic">menu_book</span>
      <h1>Plan Contable <small>PCGE &middot; Libros electronicos SUNAT</small></h1>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if modo == 'setup' %}
      <div class="info">Primer uso: crea el usuario <strong>administrador</strong>. Despues podras crear usuarios para contadores y asistentes.</div>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" required>
    {% endif %}
    <label for="username">Usuario</label>
    <input id="username" name="username" required autofocus autocomplete="username">
    <label for="password">Contrasena{% if modo == 'setup' %} (minimo 8 caracteres){% endif %}</label>
    <input id="password" name="password" type="password" required autocomplete="{% if modo == 'setup' %}new-password{% else %}current-password{% endif %}" {% if modo == 'setup' %}minlength="8"{% endif %}>
    <button type="submit">{% if modo == 'setup' %}Crear administrador{% else %}Ingresar{% endif %}</button>
  </form>
</body>
</html>
